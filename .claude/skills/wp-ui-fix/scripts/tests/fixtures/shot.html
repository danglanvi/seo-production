<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>shot fixture</title>
<style>
body{margin:0;font:16px/1.5 Arial,sans-serif;background:#fff}
header{height:60px;background:#eee}
.sticky-sub{position:sticky;top:0;height:30px;background:rgb(0,0,200)}
/* Nút liên hệ fixed phủ giữa màn hình: ảnh theo selector phải ẩn nó, ảnh màn đầu phải giữ nó. */
.fixed-bar{position:fixed;left:0;right:0;top:300px;height:200px;background:rgb(255,0,0)}
.spacer{height:1400px}
#hop{width:300px;height:120px;background:rgb(0,160,0);margin:0 20px}
</style></head><body>
<header>Header</header>
<div class="sticky-sub"></div>
<div class="spacer"></div>
<div id="hop"></div>
<div style="height:1400px"></div>
<div class="fixed-bar"></div>
</body></html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES (viewport-base.css — embed đủ, không cắt)
   =========================================== */
html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--stage-bg,#000); }
.deck-viewport { position:fixed; inset:0; overflow:hidden; background:var(--stage-bg,#000); }
.deck-stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0; background:var(--slide-bg,#fff); }
.slide { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; display:block; visibility:hidden; opacity:0; pointer-events:none; background:var(--slide-bg,#fff); }
.slide.active, .slide.visible { visibility:visible; opacity:1; pointer-events:auto; z-index:1; }
img, video, canvas, svg { max-width:100%; max-height:100%; }
.deck-controls { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:1000; }
@media print {
  html, body { width:1920px; height:auto; overflow:visible; background:#fff; }
  .deck-viewport { position:static; overflow:visible; background:#fff; }
  .deck-stage { position:static; width:auto; height:auto; transform:none !important; background:none; }
  .slide { position:relative; display:block !important; visibility:visible !important; opacity:1 !important; pointer-events:auto !important; width:1920px; height:1080px; break-after:page; page-break-after:always; }
  .slide:last-child { break-after:auto; page-break-after:auto; }
  .deck-controls { display:none !important; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.2s !important; } }

/* ===========================================
   DESIGN SYSTEM — GTV weekly report
   =========================================== */
:root {
  --stage-bg:#0c0f2a;
  --slide-bg:#f5f4f1;                 /* nền giấy sáng */
  --ink:#15195c;                      /* navy chữ chính */
  --ink-soft:#3a3f66;
  --blue:#0693E3; --purple:#9900EF; --cyan:#00c6ff;
  --grad:linear-gradient(95deg,var(--cyan) 0%,var(--blue) 38%,var(--purple) 100%);
  --pos:#0e8a4d; --pos-bg:#e2f4e9;
  --neg:#d61f3d; --neg-bg:#fde6ea;
  --mut:#6b7089; --mut-bg:#eeeef2;
  --thead:#1b2a6b;                    /* header bảng navy */
  --row-alt:#eef0f7;
  --kpi-hl:#fff3cf;                   /* vàng nhạt cột/nhóm thuộc cụm KPI */
  --card:#ffffff;
  --border:#d7d9e6;
  font-family:'Be Vietnam Pro',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
.slide { font-family:'Be Vietnam Pro',-apple-system,'Segoe UI',Roboto,Arial,sans-serif; color:var(--ink); }

/* ---- khung chung mỗi slide nội dung ---- */
.s-pad { position:absolute; inset:0; padding:56px 72px 48px; box-sizing:border-box; display:flex; flex-direction:column; }
.brandbar { position:absolute; top:34px; left:56px; right:56px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
.brandbar img.logo-client { height:58px; width:auto; }
.brandbar img.logo-gtv { height:64px; width:auto; }
.pill { align-self:center; margin:0 auto; background:var(--grad); color:#fff; font-weight:800; font-size:40px; letter-spacing:.5px; padding:16px 56px; border-radius:18px; box-shadow:0 10px 26px rgba(9,20,80,.18); text-transform:uppercase; }
.pill-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px; }
.pill-underline { width:340px; height:3px; background:var(--ink); opacity:.65; }
.slide-sub { text-align:center; font-size:34px; font-weight:800; color:#0d1240; }
.slide-sub .idx { color:var(--blue); }
.content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; }
.src-note { position:absolute; right:72px; bottom:26px; font-size:19px; color:var(--mut); }
.src-note a { color:var(--blue); text-decoration:underline; }

/* ---- COVER ---- */
.cover { background:linear-gradient(118deg,#0a6fe8 0%,#0693E3 30%,#4a4fd8 68%,#8b12d8 100%); }
.cover .brandbar img.logo-client { background:#fff; padding:10px 18px; border-radius:12px; height:64px; box-sizing:content-box; }
.cover-box { position:absolute; left:110px; top:250px; right:110px; color:#fff; }
.cover-title { font-size:118px; font-weight:900; letter-spacing:1px; line-height:1.05; margin:0; }
.cover-outline { font-size:104px; font-weight:900; letter-spacing:2px; color:transparent; -webkit-text-stroke:3px #fff; margin:14px 0 0; line-height:1.08; }
.cover-week { margin-top:38px; font-size:40px; font-weight:700; opacity:.95; }
.cover-domain { margin-top:16px; font-size:30px; font-style:italic; opacity:.85; }
.cover-foot { position:absolute; left:110px; right:110px; bottom:64px; display:flex; justify-content:space-between; align-items:center; border-top:2px solid rgba(255,255,255,.7); padding-top:22px; color:#fff; font-size:28px; font-weight:700; letter-spacing:2px; }

/* ---- AGENDA ---- */
.agenda-left { position:absolute; left:0; top:0; bottom:0; width:640px; background:#f1efe9; display:flex; align-items:center; justify-content:center; }
.agenda-word { font-size:96px; font-weight:900; color:#1b1f7a; letter-spacing:3px; -webkit-text-stroke:2px #1b1f7a; }
.agenda-right { position:absolute; left:640px; top:0; bottom:0; right:0; background:linear-gradient(120deg,#7a10d8 0%,#4a4fd8 42%,#0693E3 100%); border-radius:56px 0 0 56px; display:flex; flex-direction:column; justify-content:center; gap:52px; padding:0 96px; }
.agenda-item { color:#fff; font-size:44px; font-weight:800; letter-spacing:.5px; }

/* ---- CARD RUN-RATE ---- */
.rr-cards { display:flex; gap:26px; }
.rr-card { flex:1; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px 26px; box-shadow:0 6px 18px rgba(20,25,90,.07); }
.rr-card h4 { margin:0 0 12px; font-size:24px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.rr-vals { display:flex; gap:34px; align-items:baseline; flex-wrap:wrap; }
.rr-num { font-size:44px; font-weight:900; color:var(--ink); }
.rr-lbl { font-size:20px; color:var(--mut); display:block; margin-top:2px; font-weight:600; }
.rr-pct-good { color:var(--pos); font-size:44px; font-weight:900; }
.rr-pct-bad { color:var(--neg); font-size:44px; font-weight:900; }

/* ---- BẢNG DATA ---- */
.tbl-wrap { background:var(--card); border:1.5px solid #10143c; border-radius:14px; padding:10px 12px; box-shadow:0 10px 26px rgba(9,15,60,.10); overflow:hidden; }
table.data { border-collapse:collapse; width:100%; font-size:22px; }
table.data thead th { background:var(--thead); color:#fff; font-weight:700; padding:10px 12px; border:1px solid #2c3a80; text-align:center; font-size:21px; line-height:1.25; }
table.data td { padding:8px 12px; border:1px solid #dcdfeb; color:var(--ink); }
table.data tbody tr:nth-child(even) td { background:var(--row-alt); }
table.data td.name { text-align:left; font-weight:600; }
table.data td.num { text-align:right; font-variant-numeric:tabular-nums; }
table.data td.ctr { text-align:center; }
table.data td.pos { color:var(--pos); background:var(--pos-bg); font-weight:700; text-align:right; }
table.data td.neg { color:var(--neg); background:var(--neg-bg); font-weight:700; text-align:right; }
table.data td.mut { color:var(--mut); background:var(--mut-bg); text-align:right; }
table.data tr.kpi-row td.name { background:var(--kpi-hl); }
table.data tr.total td { font-weight:800; background:#e7eaf6; border-top:2px solid var(--thead); }
table.data tr.hl td { outline:3px solid var(--neg); outline-offset:-3px; }
table.data.compact { font-size:19px; }
table.data.compact td, table.data.compact thead th { padding:6px 9px; }
table.data.dense td, table.data.dense thead th { padding:3px 8px; }

/* ---- NHẬN XÉT ---- */
.split { display:flex; gap:36px; align-items:flex-start; }
.split .col-l { flex:1.35; min-width:0; }
.split .col-r { flex:1; min-width:0; }
.nx { margin-top:4px; }
.nx h3 { font-size:38px; font-weight:900; color:#0d1240; letter-spacing:1px; margin:0 0 14px; }
.nx ul { margin:0; padding-left:30px; font-size:26px; line-height:1.55; color:var(--ink-soft); }
.nx ul ul { font-size:25px; margin-top:6px; }
.nx li { margin-bottom:8px; }
.nx b { color:var(--ink); }
.up { color:var(--pos); font-weight:800; }
.down { color:var(--neg); font-weight:800; }
.flat { color:var(--mut); font-weight:700; }
.action { background:#fff; border-left:8px solid var(--blue); border-radius:10px; padding:14px 20px; margin-top:16px; font-size:24px; color:var(--ink); box-shadow:0 4px 14px rgba(9,15,60,.08); }
.action b { color:var(--purple); }

/* ---- SOW / STATUS ---- */
.chips { display:flex; gap:22px; margin-bottom:8px; }
.chip { flex:1; text-align:center; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 8px; }
.chip .n { font-size:52px; font-weight:900; display:block; }
.chip .t { font-size:21px; color:var(--mut); font-weight:700; }
.chip.done .n { color:var(--pos); } .chip.doing .n { color:var(--blue); }
.chip.notyet .n { color:var(--mut); } .chip.late .n { color:var(--neg); } .chip.paused .n { color:#b58900; }

/* ---- CAPTURE (ảnh Looker / sheet / tool) ---- */
.shot-frame { background:#fff; border:2px solid #10143c; border-radius:14px; padding:10px; box-shadow:0 10px 26px rgba(9,15,60,.12); display:flex; align-items:center; justify-content:center; }
.shot-frame img { border-radius:8px; width:100%; height:auto; max-height:760px; object-fit:contain; }
.shot-caption { font-size:22px; color:var(--mut); text-align:center; margin-top:10px; }
.manual-slot { border:3px dashed var(--mut); border-radius:14px; min-height:520px; display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:30px; font-weight:700; background:#fbfbfd; }

/* ---- LINE CHART (SVG tự vẽ — không lib ngoài) ---- */
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 22px; box-shadow:0 6px 18px rgba(20,25,90,.07); }
.chart-title { font-size:26px; font-weight:800; text-align:center; margin:0 0 8px; color:var(--ink); }
.legend { display:flex; gap:26px; justify-content:center; font-size:20px; color:var(--ink-soft); margin-top:6px; flex-wrap:wrap; }
.legend .key { display:inline-block; width:26px; height:6px; border-radius:3px; margin-right:8px; vertical-align:middle; }
svg.line-chart { width:100%; height:auto; }
svg.line-chart .axis { stroke:#c3c6d6; stroke-width:1; }
svg.line-chart .gridline { stroke:#e7e8f0; stroke-width:1; }
svg.line-chart .tick { font-size:17px; fill:var(--mut); font-family:inherit; }
svg.line-chart polyline { fill:none; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
.st-client { stroke:#0693E3; } .st-c1 { stroke:#d61f3d; } .st-c2 { stroke:#0e8a4d; } .st-c3 { stroke:#7a3fd8; }
.bg-client { background:#0693E3; } .bg-c1 { background:#d61f3d; } .bg-c2 { background:#0e8a4d; } .bg-c3 { background:#7a3fd8; }

/* ---- SUPPORT TABLE / Q&A / THANK YOU ---- */
.support-note { font-size:24px; color:var(--mut); text-align:center; margin-top:14px; }
.qna { background:linear-gradient(118deg,#0a6fe8 0%,#4a4fd8 55%,#8b12d8 100%); }
.qna-title { position:absolute; left:110px; top:120px; color:#fff; font-size:84px; font-weight:900; letter-spacing:1px; border-bottom:4px solid #fff; padding-bottom:18px; }
.qna-big { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:320px; font-weight:900; color:rgba(255,255,255,.22); letter-spacing:10px; }
.thanks { background:#f3f1ec; }
.thanks-logos { position:absolute; top:130px; left:0; right:0; display:flex; gap:44px; align-items:center; justify-content:center; }
.thanks-logos img { height:74px; }
.thanks-x { font-size:40px; color:var(--ink-soft); font-weight:700; }
.thanks-word { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:200px; font-weight:900; color:#101335; font-style:italic; letter-spacing:2px; }
.thanks-foot { position:absolute; bottom:90px; left:0; right:0; text-align:center; font-size:30px; font-weight:800; letter-spacing:3px; color:var(--ink); }

/* ---- điều hướng slide: breadcrumb + số trang + scope-note (luật trình bày 22/07) ---- */
.crumb { text-align:center; font-size:19px; color:var(--mut); letter-spacing:1.5px; text-transform:uppercase; font-weight:700; margin-bottom:4px; }
.page-no { position:absolute; right:30px; bottom:26px; font-size:19px; color:var(--mut); font-weight:700; }
.cover .page-no, .qna .page-no { color:rgba(255,255,255,.75); }
.scope-note { font-size:20px; color:#8a6d00; background:#fff7dd; border:1px solid #e8d48a; border-radius:8px; padding:6px 14px; align-self:center; }

/* ---- ghi chú nguồn dữ liệu bắt buộc (luật Reporter) ---- */
.data-meta { position:absolute; left:72px; bottom:26px; font-size:19px; color:var(--mut); max-width:1500px; }

/* ---- bảng CRV hỗ trợ: cột Description rộng, hàng cao để gõ nhiều dòng khi bấm E ---- */
table.support-tbl td { min-height:90px; height:90px; vertical-align:top; }
table.support-tbl td.name { vertical-align:middle; }
table.support-tbl td.desc { width:70%; font-weight:400; vertical-align:top; }

/* ---- divider TĂNG/GIẢM trong bảng khu vực ---- */
table.data tr.divider td { background:#e7f3ec; color:#0e8a4d; font-weight:800; text-align:left; font-size:18px; letter-spacing:.5px; border-top:2px solid #0e8a4d; }
table.data tr.divider-neg td { background:#fbe9ec; color:#d61f3d; font-weight:800; text-align:left; font-size:18px; letter-spacing:.5px; }

/* ---- INLINE EDIT (bấm E) ---- */
.edit-hotzone { position:fixed; top:0; left:0; width:80px; height:80px; z-index:10000; cursor:pointer; }
.edit-toggle { position:fixed; top:18px; left:18px; z-index:10001; opacity:0; pointer-events:none; transition:opacity .3s; border:none; background:var(--grad); color:#fff; width:48px; height:48px; border-radius:14px; font-size:22px; cursor:pointer; box-shadow:0 10px 26px -8px rgba(6,147,227,.7); }
.edit-toggle.show, .edit-toggle.active { opacity:1; pointer-events:auto; }
body.editing [contenteditable] { outline:2px dashed rgba(6,147,227,.55); outline-offset:4px; border-radius:4px; }
@media print { .edit-hotzone, .edit-toggle { display:none !important; } }

/* ==== DECK CHROME: rail thumbnail + Present + #hash (round 4b 22/07 — port từ deck event) ==== */
.chrome-btns { position:fixed; top:14px; left:14px; z-index:70; display:flex; gap:8px; opacity:0; pointer-events:none; transition:opacity .25s; }
.chrome-btns.show { opacity:1; pointer-events:auto; }
.chrome-btns button { background:rgba(15,23,42,.84); color:#fff; border:1px solid rgba(255,255,255,.28); border-radius:8px; padding:7px 14px; font-family:inherit; font-size:13px; font-weight:700; letter-spacing:.02em; cursor:pointer; }
.chrome-btns button:hover { background:rgba(30,41,59,.95); }
.rail { box-sizing:border-box; position:fixed; left:0; top:0; bottom:0; width:178px; background:rgba(10,14,26,.94); z-index:65; overflow-y:auto; padding:56px 12px 14px; display:none; box-shadow:2px 0 14px rgba(0,0,0,.35); }
body.rail-open .rail { display:block; }
.rail::-webkit-scrollbar { width:8px; }
.rail::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:4px; }
.rail .thumb { display:block; width:100%; margin:0 0 12px; cursor:pointer; background:none; border:0; padding:0; text-align:left; outline:none; }
.rail .num { display:block; color:#94a3b8; font-size:11px; font-weight:700; margin:0 0 3px; font-family:inherit; }
.rail .thumb.cur .num { color:#fff; }
.rail .frame { display:block; position:relative; width:150px; height:85px; overflow:hidden; border-radius:4px; outline:2px solid rgba(255,255,255,.14); background:#fff; }
.rail .thumb:hover .frame { outline-color:rgba(255,255,255,.4); }
.rail .thumb.cur .frame { outline-color:#0693E3; }
.rail .mini { display:block; width:1920px; height:1080px; -webkit-transform:scale(.078125); transform:scale(.078125); -webkit-transform-origin:0 0; transform-origin:0 0; pointer-events:none; }
.rail-grip { position:fixed; top:0; bottom:0; width:7px; cursor:col-resize; z-index:66; display:none; }
body.rail-open .rail-grip { display:block; }
.rail-grip:hover, body.rail-resizing .rail-grip { background:rgba(255,255,255,.22); }
body.rail-resizing { cursor:col-resize; }
body.rail-resizing * { -webkit-user-select:none; user-select:none; }
@media print { .rail, .chrome-btns, .edit-btn, .rail-grip { display:none !important; } }
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage">

<!-- SLIDES -->

</div></div>

<div class="deck-controls"></div>
<div class="edit-hotzone"></div>
<button class="edit-toggle" id="editToggle" title="Chế độ sửa (E)">✏️</button>

<script>
/* Logo nhúng MỘT lần (thay vì lặp base64 per-slide) — build_deck.py thay placeholder. */
var LOGOS = { client: '{{LOGO_CLIENT_B64}}', gtv: '{{LOGO_GTV_B64}}' };
</script>
<script>
/* ES5 thuần — Safari-safe. Không arrow function, không template literal, không optional chaining. */
(function () {
  var EDIT_KEY = '{{EDIT_KEY}}';
  var stage = document.querySelector('.deck-stage');

  /* ---- khôi phục nội dung đã sửa (nếu có) TRƯỚC khi query slide ---- */
  try {
    var saved = localStorage.getItem(EDIT_KEY);
    if (saved) { stage.innerHTML = saved; }
  } catch (err) {}

  /* ---- gán logo từ LOGOS (nhúng 1 lần cho deck nhẹ) — chạy SAU restore để bản khôi phục cũng có logo ---- */
  try {
    if (typeof LOGOS !== 'undefined') {
      var logoImgs = document.querySelectorAll('img.logo-client, img.logo-gtv');
      for (var li0 = 0; li0 < logoImgs.length; li0++) {
        logoImgs[li0].src = (String(logoImgs[li0].className).indexOf('logo-client') !== -1) ? LOGOS.client : LOGOS.gtv;
      }
    }
  } catch (eLogo) {}

  function fit() {
    var rw = (document.body.className.indexOf('rail-open') !== -1 && window.__railW) ? window.__railW : 0;
    var aw = window.innerWidth - rw;
    var s = Math.min(aw / 1920, window.innerHeight / 1080);
    stage.style.transform = 'translate(' + (rw + (aw - 1920 * s) / 2) + 'px,' + (window.innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();

  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0;
  for (var i = 0; i < slides.length; i++) {
    if (slides[i].className.indexOf('active') !== -1) { cur = i; break; }
  }
  function show(n) {
    cur = Math.max(0, Math.min(slides.length - 1, n));
    for (var j = 0; j < slides.length; j++) {
      if (j === cur) {
        if (slides[j].className.indexOf('active') === -1) { slides[j].className += ' active'; }
      } else {
        slides[j].className = slides[j].className.replace(/\s*\bactive\b/g, '');
      }
    }
  }
  show(cur);

  /* ==== DECK CHROME (round 4b): rail thumbnail + \u25B6 Present + #hash \u2014 ES5, Safari-safe ==== */
  var railBox = null, railThumbs = [], railBuilt = false, railDirty = false, chromeBox = null, chromeTimer = null;
  var RAIL_MIN = 140, RAIL_MAX = 440, railWidth = 178, railGrip = null;
  try { var rw0 = parseInt(localStorage.getItem(EDIT_KEY + '-railw'), 10); if (rw0 >= RAIL_MIN && rw0 <= RAIL_MAX) { railWidth = rw0; } } catch (eA) {}
  window.__railW = railWidth;
  function applyRailSize() {
    window.__railW = railWidth;
    if (railBox) { railBox.style.width = railWidth + 'px'; }
    if (railGrip) { railGrip.style.left = (railWidth - 7) + 'px'; }
    var fw = railWidth - 28;
    var fh = Math.round(fw * 1080 / 1920);
    var sc = fw / 1920;
    for (var z = 0; z < railThumbs.length; z++) {
      var frz = railThumbs[z].getElementsByClassName('frame')[0];
      var mnz = railThumbs[z].getElementsByClassName('mini')[0];
      if (frz) { frz.style.width = fw + 'px'; frz.style.height = fh + 'px'; }
      if (mnz) { mnz.style.webkitTransform = 'scale(' + sc + ')'; mnz.style.transform = 'scale(' + sc + ')'; }
    }
    fit();
  }
  function railSyncCur() {
    for (var q = 0; q < railThumbs.length; q++) {
      railThumbs[q].className = (q === cur) ? 'thumb cur' : 'thumb';
    }
    var elc = railThumbs[cur];
    if (elc && elc.scrollIntoView) { try { elc.scrollIntoView({ block: 'nearest' }); } catch (e9) {} }
  }
  var _showBase = show;
  show = function (n) {
    _showBase(n);
    try { if (history.replaceState) { history.replaceState(null, '', '#' + (cur + 1)); } } catch (e8) {}
    railSyncCur();
  };
  function buildRail() {
    railBox.innerHTML = ''; railThumbs = []; railBuilt = true; railDirty = false;
    for (var r = 0; r < slides.length; r++) {
      var th = document.createElement('button'); th.type = 'button'; th.className = 'thumb';
      th.title = 'Slide ' + (r + 1);
      var num = document.createElement('span'); num.className = 'num'; num.textContent = String(r + 1);
      var fr = document.createElement('span'); fr.className = 'frame';
      var mini = document.createElement('span'); mini.className = 'mini';
      var cl = slides[r].cloneNode(true);
      cl.className = String(cl.className).replace(/\s*\bactive\b/g, '');
      cl.removeAttribute('id');
      cl.style.position = 'relative'; cl.style.visibility = 'visible'; cl.style.opacity = '1';
      cl.style.pointerEvents = 'none'; cl.style.display = 'block';
      var eds = cl.querySelectorAll('[contenteditable]');
      for (var w = 0; w < eds.length; w++) { eds[w].removeAttribute('contenteditable'); }
      mini.appendChild(cl); fr.appendChild(mini); th.appendChild(num); th.appendChild(fr);
      (function (idx, btn2) {
        btn2.addEventListener('click', function (ev) { ev.stopPropagation(); show(idx); });
      })(r, th);
      railBox.appendChild(th); railThumbs.push(th);
    }
    applyRailSize();
    railSyncCur();
  }
  function toggleRail(force) {
    var open = document.body.className.indexOf('rail-open') !== -1;
    var want = (force === true) ? true : ((force === false) ? false : !open);
    if (want && (!railBuilt || railDirty)) { buildRail(); }
    if (want && !open) { document.body.className += ' rail-open'; }
    if (!want) { document.body.className = document.body.className.replace(/\s*\brail-open\b/g, ''); }
    fit();
  }
  function goPresent() {
    toggleRail(false);
    var elf = document.documentElement;
    if (elf.requestFullscreen) { elf.requestFullscreen(); }
    else if (elf.webkitRequestFullscreen) { elf.webkitRequestFullscreen(); }
  }
  (function () {
    railBox = document.createElement('div'); railBox.className = 'rail';
    railBox.style.width = railWidth + 'px';
    railBox.addEventListener('click', function (ev) { ev.stopPropagation(); });
    railGrip = document.createElement('div'); railGrip.className = 'rail-grip';
    railGrip.style.left = (railWidth - 7) + 'px';
    railGrip.addEventListener('click', function (ev) { ev.stopPropagation(); });
    document.body.appendChild(railGrip);
    var railDrag = false;
    railGrip.addEventListener('mousedown', function (ev) {
      railDrag = true; ev.preventDefault(); ev.stopPropagation();
      document.body.className += ' rail-resizing';
    });
    document.addEventListener('mousemove', function (ev) {
      if (!railDrag) { return; }
      var w2 = Math.max(RAIL_MIN, Math.min(RAIL_MAX, ev.clientX));
      if (w2 !== railWidth) { railWidth = w2; applyRailSize(); }
    });
    document.addEventListener('mouseup', function () {
      if (!railDrag) { return; }
      railDrag = false;
      document.body.className = document.body.className.replace(/\s*\brail-resizing\b/g, '');
      try { localStorage.setItem(EDIT_KEY + '-railw', String(railWidth)); } catch (eB) {}
    });
    chromeBox = document.createElement('div'); chromeBox.className = 'chrome-btns';
    chromeBox.addEventListener('click', function (ev) { ev.stopPropagation(); });
    var bR = document.createElement('button'); bR.type = 'button'; bR.textContent = '\u2630 Slides \u00B7 T';
    var bP = document.createElement('button'); bP.type = 'button'; bP.textContent = '\u25B6 Present';
    bR.addEventListener('click', function (ev) { ev.stopPropagation(); toggleRail(); });
    bP.addEventListener('click', function (ev) { ev.stopPropagation(); goPresent(); });
    chromeBox.appendChild(bR); chromeBox.appendChild(bP);
    document.body.appendChild(railBox); document.body.appendChild(chromeBox);
    document.addEventListener('mousemove', function () {
      if (chromeBox.className.indexOf('show') === -1) { chromeBox.className += ' show'; }
      if (chromeTimer) { clearTimeout(chromeTimer); }
      chromeTimer = setTimeout(function () {
        if (document.body.className.indexOf('rail-open') === -1) {
          chromeBox.className = chromeBox.className.replace(/\s*\bshow\b/g, '');
        }
      }, 2600);
    });
    window.addEventListener('keydown', function (e) {
      if (e.target && e.target.isContentEditable) { return; }
      if (e.key === 'e' || e.key === 'E') { railDirty = true; return; }
      if (e.key === 't' || e.key === 'T') { toggleRail(); }
      if (e.key === 'Escape') { toggleRail(false); }
    });
    var mh = String(location.hash || '').match(/^#(\d+)$/);
    if (mh) { show(parseInt(mh[1], 10) - 1); }
    window.addEventListener('hashchange', function () {
      var m2 = String(location.hash || '').match(/^#(\d+)$/);
      if (m2 && (parseInt(m2[1], 10) - 1) !== cur) { show(parseInt(m2[1], 10) - 1); }
    });
  })();


  /* ---- INLINE EDIT: phím E / hotzone góc trên trái / nút bút ---- */
  var editor = {
    isActive: false,
    targets: 'h1,h2,h3,h4,p,li,td,th',
    toggle: function () {
      this.isActive = !this.isActive;
      if (this.isActive) {
        document.body.className += ' editing';
        document.getElementById('editToggle').className += ' active';
      } else {
        document.body.className = document.body.className.replace(/\s*\bediting\b/g, '');
        var bt = document.getElementById('editToggle');
        bt.className = bt.className.replace(/\s*\bactive\b/g, '');
      }
      var els = document.querySelectorAll(this.targets);
      for (var k = 0; k < els.length; k++) {
        els[k].setAttribute('contenteditable', this.isActive ? 'true' : 'false');
      }
      if (!this.isActive) { this.save(); }
    },
    save: function () {
      try { localStorage.setItem(EDIT_KEY, stage.innerHTML); } catch (err) {}
    }
  };
  var btn = document.getElementById('editToggle');
  var hot = document.querySelector('.edit-hotzone');
  var hideT = null;
  btn.addEventListener('click', function () { editor.toggle(); });
  hot.addEventListener('click', function () { editor.toggle(); });
  hot.addEventListener('mouseenter', function () {
    if (hideT) { clearTimeout(hideT); }
    if (btn.className.indexOf('show') === -1) { btn.className += ' show'; }
  });
  function hideBtnLater() {
    hideT = setTimeout(function () {
      if (!editor.isActive) { btn.className = btn.className.replace(/\s*\bshow\b/g, ''); }
    }, 400);
  }
  hot.addEventListener('mouseleave', hideBtnLater);
  btn.addEventListener('mouseenter', function () { if (hideT) { clearTimeout(hideT); } });
  btn.addEventListener('mouseleave', hideBtnLater);

  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.isContentEditable) { return; }
    if (e.key === 'e' || e.key === 'E') { editor.toggle(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); editor.save(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { show(cur + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(cur - 1); }
    if (e.key === 'Home') { show(0); }
    if (e.key === 'End') { show(slides.length - 1); }
  });
  window.addEventListener('click', function (e) {
    if (editor.isActive) { return; }
    if (e.target && e.target.isContentEditable) { return; }
    var t = e.target;
    while (t) {
      if (t.id === 'editToggle' || (t.className && String(t.className).indexOf('edit-hotzone') !== -1)) { return; }
      t = t.parentElement;
    }
    if (e.clientX > window.innerWidth / 2) { show(cur + 1); } else { show(cur - 1); }
  });
})();
</script>
